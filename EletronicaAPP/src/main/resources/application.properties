# =====================================================================
#  Configuração padrão do EletronicaAPP (versionada no Git)
#
#  NÃO coloque senhas reais aqui. Para definir as credenciais use:
#    - o arquivo application-local.properties (na pasta EletronicaAPP/,
#      ignorado pelo Git - veja application-local.properties.example); ou
#    - as variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD; ou
#    - propriedades da JVM: -Ddb.password=...
# =====================================================================

# ---------- Banco de dados (PostgreSQL) ----------
db.url=jdbc:postgresql://localhost:5432/eletronicadb
db.user=postgres
db.password=

# ---------- Pool de conexões (HikariCP) ----------
db.pool.maximumPoolSize=5
db.pool.minimumIdle=1
# Tempo máximo (ms) aguardando uma conexão livre / o banco responder
db.pool.connectionTimeoutMs=5000
db.pool.idleTimeoutMs=300000
db.pool.maxLifetimeMs=1800000

# ---------- Segurança ----------
# Custo (log2 de iterações) do BCrypt: 10 a 12 é um bom equilíbrio
security.bcrypt.cost=10
